name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The tests run before anything is published. If one fails, this job stops here: the live site stays on the
      # last version that passed, and GitHub emails whoever pushed. They need no installing, and the two that read
      # real PDFs switch themselves off here, since exports/ is never committed.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run the tests
        run: node --test tests/*.test.js

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Stamp the version into asset URLs
        run: sed -i "s/__VERSION__/${GITHUB_SHA::12}/g" index.html

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
