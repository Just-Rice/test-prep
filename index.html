<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1F242B">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%231F242B'/%3E%3Cpath d='M17 18h30v9H36.5v21h-9V27H17z' fill='%23F2B01E'/%3E%3C/svg%3E">
  <title>Test Prep</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Source+Sans+3:wght@400;600;700&display=swap">
  <!-- __VERSION__ becomes the commit when the site is deployed (.github/workflows/pages.yml), so a browser never
       runs a cached file from an older version next to newer ones. List every module the app loads here. -->
  <link rel="stylesheet" href="css/app.css?v=__VERSION__">
  <script type="importmap">
  {
    "imports": {
      "./js/adaptive.js": "./js/adaptive.js?v=__VERSION__",
      "./js/calc.js": "./js/calc.js?v=__VERSION__",
      "./js/demo-questions.js": "./js/demo-questions.js?v=__VERSION__",
      "./js/exams.js": "./js/exams.js?v=__VERSION__",
      "./js/explain.js": "./js/explain.js?v=__VERSION__",
      "./js/firebase-config.js": "./js/firebase-config.js?v=__VERSION__",
      "./js/irt.js": "./js/irt.js?v=__VERSION__",
      "./js/settings.js": "./js/settings.js?v=__VERSION__",
      "./js/questions/index.js": "./js/questions/index.js?v=__VERSION__",
      "./js/questions/algebra.js": "./js/questions/algebra.js?v=__VERSION__",
      "./js/questions/advanced-math.js": "./js/questions/advanced-math.js?v=__VERSION__",
      "./js/questions/problem-solving.js": "./js/questions/problem-solving.js?v=__VERSION__",
      "./js/questions/geometry.js": "./js/questions/geometry.js?v=__VERSION__",
      "./js/questions/information-and-ideas.js": "./js/questions/information-and-ideas.js?v=__VERSION__",
      "./js/questions/craft-and-structure.js": "./js/questions/craft-and-structure.js?v=__VERSION__",
      "./js/questions/expression-of-ideas.js": "./js/questions/expression-of-ideas.js?v=__VERSION__",
      "./js/questions/standard-english.js": "./js/questions/standard-english.js?v=__VERSION__",
      "./js/srs.js": "./js/srs.js?v=__VERSION__",
      "./js/store.js": "./js/store.js?v=__VERSION__",
      "./js/sync.js": "./js/sync.js?v=__VERSION__",
      "./js/sync-core.js": "./js/sync-core.js?v=__VERSION__",
      "./js/taxonomy.js": "./js/taxonomy.js?v=__VERSION__",
      "./js/taxonomy-act.js": "./js/taxonomy-act.js?v=__VERSION__"
    }
  }
  </script>
  <script>
    // Appearance settings (js/settings.js) are applied before the first paint, so the page never flashes the
    // wrong theme, accent or text size while the app loads.
    try {
      var saved = JSON.parse(localStorage.getItem('satprep.settings.v1') || '{}');
      ['theme', 'accent', 'textsize', 'contrast', 'motion'].forEach(function (key) {
        if (saved[key]) document.documentElement.setAttribute('data-' + key, saved[key]);
      });
    } catch (e) { /* storage unavailable */ }
  </script>
  <script>
    // If the app can't start, say so instead of showing "Loading…" forever.
    function showLoadError() {
      var view = document.getElementById('view');
      if (!view || !view.hasAttribute('data-loading')) return;
      view.removeAttribute('data-loading');
      view.innerHTML = '<div class="empty"><h2>SAT Prep didn\u2019t load</h2><p>Reload the page to try again.</p>'
        + '<div class="actions"><button class="primary" type="button" onclick="location.reload()">Reload</button></div></div>';
    }
    window.addEventListener('error', showLoadError);
  </script>
</head>
<body>
  <div class="shell">
    <aside class="side" id="side"></aside>
    <header class="topbar" id="topbar"></header>
    <main id="view" data-loading><div class="skeleton" role="status"><span class="visually-hidden">Loading…</span><div class="sk sk-title"></div><div class="sk sk-card"></div><div class="sk-row"><div class="sk sk-tile"></div><div class="sk sk-tile"></div><div class="sk sk-tile"></div></div></div></main>
  </div>
  <nav class="tabs" id="tabs" aria-label="Main"></nav>
  <div class="sheet" id="more" hidden></div>
  <script type="module" src="js/app.js?v=__VERSION__" onerror="showLoadError()"></script>
</body>
</html>
